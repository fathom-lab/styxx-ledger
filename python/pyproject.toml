[build-system]
# setuptools reads `license` as an spdx expression, with `license-files`, from version 77 on (pep 639); the table
# form it replaces is deprecated, with removal announced for 2027-02-18.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "styxx-ledger"
dynamic = ["version"]
description = "reference writer and verifier for the styxx ledger protocol v1 (python): an agent's append-only, hash-chained json-lines event log with daily posted heads, re-derivable by anyone holding the file"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Fathom Intelligence"}]
keywords = ["ledger", "hash-chain", "append-only", "tamper-evident", "audit-log", "jsonl", "agent", "opentimestamps", "jcs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Logging",
]
# windows python ships no iana zone database; zoneinfo reads it from the tzdata package there.
dependencies = ["tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
styxx-ledger = "styxx_ledger.cli:main"

[project.urls]
Homepage = "https://github.com/fathom-lab/styxx-ledger"
Repository = "https://github.com/fathom-lab/styxx-ledger"
Issues = "https://github.com/fathom-lab/styxx-ledger/issues"
Protocol = "https://github.com/fathom-lab/styxx-ledger/blob/main/PROTOCOL_v1.md"

[tool.setuptools.dynamic]
version = {attr = "styxx_ledger._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
